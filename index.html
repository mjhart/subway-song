<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subway Song</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f1;
    --fg: #1b1b1b;
    --muted: #6b6b6b;
    --rule: #dcdad3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #ededed; --muted: #9a9a9a; --rule: #2a2a2a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
  }
  h1 { margin: 0; font-size: 18px; }
  #status { color: var(--muted); font-size: 13px; }
  #status.error { color: #d0342c; }
  #sound {
    margin-left: auto;
    font: inherit;
    font-size: 13px;
    padding: 4px 12px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  #sound[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  #log { list-style: none; margin: 0; padding: 0; }
  /* Notes played together are bracketed by a bar down the left edge. */
  #log li.chord {
    margin: 6px 0;
    border-left: 4px solid var(--fg);
    background: color-mix(in srgb, var(--fg) 6%, transparent);
  }
  #log li.chord .row { padding-left: 12px; }
  #log li.chord .row:last-child { border-bottom: none; }
  .row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 10px;
    padding: 7px 16px;
    border-bottom: 1px solid var(--rule);
  }
  .times {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    flex: none;
  }
  .bullet {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: bold;
    font-size: 13px;
    color: #fff;
    background: #808183;
  }
  .dest { color: var(--muted); }
  #empty { padding: 24px 16px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Subway Song</h1>
  <span id="status">Connecting to MTA feeds…</span>
  <button id="sound" type="button" aria-pressed="false">Sound: off</button>
</header>
<p id="empty">Waiting for the first train to pull in…</p>
<ol id="log"></ol>

<script src="stations.js"></script>
<script src="gtfs-rt.js"></script>
<script src="tracker.js"></script>
<script src="app.js"></script>
</body>
</html>
